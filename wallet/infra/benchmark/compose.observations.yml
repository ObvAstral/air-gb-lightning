# Optional overlay; does not create or reset wallets. Use with the root Compose files.
services:
  alice:
    environment:
      AIRGB_BENCHMARK_EVENTS: "1"
      QVAC_BRIDGE_HOST: "${QVAC_BRIDGE_HOST:-host.docker.internal}"
      QVAC_MODEL: "${QVAC_MODEL:-qwen-fast}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./wallet/apps/local-service:/app/apps/local-service:ro"
